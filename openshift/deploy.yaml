# Kurulum (README "OpenShift'e deploy"):
#   oc create secret generic release-summarizer --from-literal=LLM_API_KEY=<key> [--from-literal=GITHUB_TOKEN=<token>]
#   oc apply -f openshift/deploy.yaml
# Ayar değiştirmek: bu dosyayı düzenle, oc apply, ardından oc rollout restart deploy/release-summarizer
apiVersion: v1
kind: ConfigMap
metadata:
  name: release-summarizer
data:
  LLM_BASE_URL: "https://api.deepseek.com"  # OpenAI uyumlu endpoint; kurum içi ör. http://litellm:4000/v1
  LLM_MODEL: "deepseek-flash"                # DeepSeek-V4.1-Flash
  CHECK_CRON: "0 6 * * *"                  # her gün 06:00
  CHECK_TIMEZONE: "Europe/Istanbul"         # GMT+3
  RETENTION_PER_PRODUCT: "10"               # ürün başına en fazla kaç sürüm saklanır, eskiler silinir
  LLM_CONCURRENCY: "4"                      # paralel özet isteği; kurum içi LLM kapasitesine göre ayarlayın
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: release-summarizer-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-summarizer
spec:
  replicas: 1                 # SQLite + uygulama içi zamanlayıcı: tek replika
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: release-summarizer}
  template:
    metadata:
      labels: {app: release-summarizer}
    spec:
      containers:
        - name: app
          image: docker.io/mustafa12/release-summarizer:0.0.1
          imagePullPolicy: Always   # aynı tag yeniden push'lanınca rollout restart güncel imajı çeker
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: release-summarizer}
            - secretRef: {name: release-summarizer}   # LLM_API_KEY, opsiyonel GITHUB_TOKEN (oc create secret ile)
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe: {httpGet: {path: /api/state, port: 8080}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/state, port: 8080}, periodSeconds: 30, failureThreshold: 5}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: release-summarizer-data}
---
apiVersion: v1
kind: Service
metadata:
  name: release-summarizer
spec:
  selector: {app: release-summarizer}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: release-summarizer
spec:
  to: {kind: Service, name: release-summarizer}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
